syntax = "proto3";
package ET;

message RouterSync
{
	uint32 ConnectId = 1;
	string Address = 2;
}

// ResponseType M2C_TestResponse
message C2M_TestRequest // ILocationRequest
{
	int32 RpcId = 1;
	string request = 2;
}

message M2C_TestResponse // IResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	string response = 4;
}


// ResponseType M2C_Reload
message C2M_Reload // ISessionRequest
{
	int32 RpcId = 1;
	string Account = 2;
	string Password = 3;
}

message M2C_Reload // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}


message G2C_TestHotfixMessage // ISessionMessage
{
	string Info = 1;
}


// ResponseType G2C_Benchmark
message C2G_Benchmark // ISessionRequest
{
	int32 RpcId = 1;
}

message G2C_Benchmark // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}

// 摇杆移动消息
message C2M_JoystickInput // ILocationMessage
{
	int32 RpcId = 1;
	float DirX = 2;
	float DirZ = 3;
	uint32 InputSequence = 4;
}

message M2C_JoystickMove // IMessage
{
	int64 UnitId = 1;
	float PosX = 2;
	float PosY = 3;
	float PosZ = 4;
	float RotX = 5;
	float RotY = 6;
	float RotZ = 7;
	float RotW = 8;
	float DirX = 9;
	float DirZ = 10;
	float Speed = 11;
	uint32 MoveSequence = 12;
	uint32 LastProcessedInputSequence = 13;
}

// 武器切换消息
message C2M_SwitchWeapon // ILocationMessage
{
	int32 RpcId = 1;
	int32 SlotIndex = 2; // 切换到的槽位（1 或 2）
}

message M2C_SwitchWeapon // IMessage
{
	int64 UnitId = 1;
	int32 SlotIndex = 2; // 切换到的槽位
	int32 WeaponId = 3; // 武器配置ID
}

message M2C_WeaponAmmoState // IMessage
{
	int64 UnitId = 1;
	int32 Slot1Ammo = 2;
	int32 Slot2Ammo = 3;
	bool Slot1Reloading = 4;
	bool Slot2Reloading = 5;
	int32 Slot1MagazineSize = 6;
	int32 Slot2MagazineSize = 7;
	float Slot1AttackRange = 8;
	float Slot2AttackRange = 9;
}

// 武器开火表现消息（服务端权威触发，客户端仅做表现）
message M2C_WeaponFire // IMessage
{
	int64 CasterUnitId = 1;
	int64 TargetUnitId = 2;
	int32 WeaponId = 3;
	int32 SlotIndex = 4;
	int32 BulletCount = 5;
	int32 FireLockTypeId = 6;
}

// 武器命中特效消息（服务端权威命中后广播）
message M2C_WeaponHit // IMessage
{
	int64 CasterUnitId = 1;
	int64 TargetUnitId = 2;
	int32 WeaponId = 3;
}

// ========================= Rogue =========================

message RogueNumericDelta
{
	int32 NumericType = 1;
	int64 Value = 2;
}

message RogueOptionData
{
	int32 OptionId = 1;
	int32 BuffConfigId = 2;
	int32 NameTextId = 3;
	int32 DescTextId = 4;
	string Icon = 5;
	int32 RerollCount = 6;
}

message M2C_RogueExpSync // IMessage
{
	int32 Level = 1;
	int32 CurrentExp = 2;
	int32 NeedExp = 3;
	int32 CurrentGold = 4;
}

message M2C_RogueLevelUp // IMessage
{
	int32 OldLevel = 1;
	int32 NewLevel = 2;
	repeated RogueNumericDelta GainedNumerics = 3;
}

message M2C_RogueChoicePopup // IMessage
{
	int64 ChoiceSerial = 1;
	repeated RogueOptionData Options = 2;
}

// ResponseType M2C_RogueChoiceResult
message C2M_RogueChooseOption // ILocationRequest
{
	int32 RpcId = 1;
	int64 ChoiceSerial = 2;
	int32 OptionId = 3;
}

message M2C_RogueChoiceResult // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 ChoiceSerial = 4;
	int32 OptionId = 5;
	int32 BuffConfigId = 6;
}

// ResponseType M2C_RogueRerollOptionResult
message C2M_RogueRerollOption // ILocationRequest
{
	int32 RpcId = 1;
	int64 ChoiceSerial = 2;
	int32 OptionIndex = 3;
	int32 CurrentOptionId = 4;
}

message M2C_RogueRerollOptionResult // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 ChoiceSerial = 4;
	int32 OptionIndex = 5;
	int32 OldOptionId = 6;
	RogueOptionData Option = 7;
}

// ResponseType M2C_DebugSpawnMonster
message C2M_DebugSpawnMonster // ILocationRequest
{
	int32 RpcId = 1;
	int32 UnitConfigId = 2;
}

message M2C_DebugSpawnMonster // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	int64 SpawnedUnitId = 4;
	int32 SpawnedConfigId = 5;
}

// ResponseType M2C_QuickExitExtraction
message C2M_QuickExitExtraction // ILocationRequest
{
	int32 RpcId = 1;
}

message M2C_QuickExitExtraction // ILocationResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
}
