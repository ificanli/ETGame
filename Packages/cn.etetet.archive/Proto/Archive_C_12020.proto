message C2G_GetBattleRecordList // ISessionRequest
{
	int32 RpcId = 1;
	int32 Limit = 2;
}

message G2C_GetBattleRecordList // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	repeated ArchiveBattleRecordSummaryProto Records = 4;
}

