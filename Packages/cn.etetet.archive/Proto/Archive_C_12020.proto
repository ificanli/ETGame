message C2G_GetBattleRecordDetail // ISessionRequest
{
	int32 RpcId = 1;
	int64 RecordId = 2;
}

message G2C_GetBattleRecordDetail // ISessionResponse
{
	int32 RpcId = 1;
	int32 Error = 2;
	string Message = 3;
	ArchiveBattleRecordSummaryProto Record = 4;
	repeated ArchiveBattleEventProto Events = 5;
}
