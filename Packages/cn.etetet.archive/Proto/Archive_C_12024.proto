syntax = "proto3";

package ET;

message ArchiveBattleEventProto
{
	int64 Timestamp = 1;
	int32 EventType = 2;
	int64 PlayerId = 3;
	int64 Value = 4;
	string Text = 5;
}

message ArchiveBattleRecordSummaryProto
{
	int64 RecordId = 1;
	int64 PlayerId = 2;
	int32 GameMode = 3;
	string MapName = 4;
	int64 MapId = 5;
	int64 StartedAt = 6;
	int64 FinishedAt = 7;
	int32 ResultType = 8;
	bool IsSuccess = 9;
	int32 KillNum = 10;
	int64 TotalWealth = 11;
}
